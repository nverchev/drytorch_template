# User settings

seed: null  # null = unset

# Compute
device: auto  # auto = the available accelerator
torch_compile: false
n_workers: 0
n_subprocesses: 0  # 0 = no DDP

# Checkpointing
checkpoint_every: 100
load: 0  # 0 = start from scratch, -1 = the latest checkpoint
run_id: null  # null = the last run

# Trackers
trackers:
  hydra: true
  tensorboard: false
  wandb: false
  sqlalchemy: false
  csv: true
  matplotlib: false
  plotly: false

# Visualization
visualization:
  show: false
