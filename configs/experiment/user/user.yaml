# User settings

seed:  # random seed; empty leaves it unset

# Compute
cpu: false
torch_compile: false
n_workers: 0
n_subprocesses: 0  # 0 disables DDP

# Checkpointing
checkpoint_every: 100
load: 0  # -1 loads the latest checkpoint
run_id:  # run to resume; empty resumes the last run

# Trackers
trackers:
  hydra: true
  tensorboard: false
  wandb: false
  sqlalchemy: false
  csv: true
  matplotlib: false  # saves the figures of the metrics
  plotly: false  # saves the figures of the metrics

# Visualization
visualization:
  interactive: false  # also shows the figures of the plotting trackers
